name: Build & Release

"on":
  push:
    tags: ['*']
  workflow_dispatch:

jobs:
  build:
    name: Build MCWIN31 T-Deck Plus
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: pio run -e MCWIN31_TDeck

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcwin31-tdeck-firmware
          path: |
            .pio/build/MCWIN31_TDeck/firmware.bin
            .pio/build/MCWIN31_TDeck/firmware-merged.bin
            webflasher/
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: mcwin31-tdeck-firmware

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            **MCWIN31 T-Deck Plus Firmware** - ${{ github.ref_name }}

            ### Flash with esptool
            ```bash
            # Full flash (first install):
            esptool.py --chip esp32s3 --port /dev/ttyACM0 write_flash 0x0 firmware-merged.bin

            # App update (keep settings):
            esptool.py --chip esp32s3 --port /dev/ttyACM0 \\
              write_flash 0x10000 firmware.bin
            ```

            ### Web Flasher
            Use the manifest at `webflasher/manifest.json` with [esptool.js](https://espressif.github.io/esptool-js/).

            | File | Use |
            |------|-----|
            | `firmware.bin` | App only (flash at 0x10000) |
            | `firmware-merged.bin` | Full flash (flash at 0x0) |
            | `webflasher/mcwin31-tdeck-firmware.bin` | App update |
            | `webflasher/mcwin31-tdeck-full.bin` | Full flash |
            | `webflasher/mcwin31-tdeck-bootloader.bin` | Bootloader |
            | `webflasher/mcwin31-tdeck-partitions.bin` | Partition table |
            | `webflasher/manifest.json` | Web flasher manifest |
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            firmware.bin
            firmware-merged.bin
            webflasher/*.bin
            webflasher/manifest.json
